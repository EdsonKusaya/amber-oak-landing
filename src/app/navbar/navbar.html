<header class="navbar">
  <div class="container navbar__inner">
    <a href="#top" class="navbar__brand" (click)="closeMenu()">
      <svg viewBox="0 0 40 40" class="navbar__mark" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="#a87c3f" stroke-width="2" />
        <circle cx="20" cy="20" r="10" fill="none" stroke="#c39a5c" stroke-width="2" />
        <circle cx="20" cy="20" r="3.5" fill="#dab77e" />
      </svg>
      <span>
        Amber <span class="navbar__brand-accent">&amp;</span> Oak
      </span>
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="menuOpen()">
      <a href="#services" (click)="closeMenu()">What we build</a>
      <a href="#about" (click)="closeMenu()">The workshop</a>
      <a href="#contact" (click)="closeMenu()">Visit &amp; contact</a>
      <a href="#contact" class="btn-brass navbar__cta" (click)="closeMenu()">Start a commission</a>
    </nav>

    <button
      type="button"
      class="navbar__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      @if (menuOpen()) {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      }
    </button>
  </div>
</header>
